<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A Little Surprise ❤️</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #080810;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 430px;
            text-align: center;
            position: relative;
            z-index: 2;
            padding: 30px 20px;
        }

        .eyebrow {
            color: #b8a5ff;
            font-size: 12px;
            letter-spacing: 4px;
            margin-bottom: 28px;
        }

        h1 {
            color: #ff579a;
            font-size: clamp(30px, 8vw, 42px);
            line-height: 1.3;
            text-shadow: 0 0 25px #ff267a66;
            margin-bottom: 20px;
        }

        .subtitle {
            color: #c5c2d6;
            line-height: 1.7;
            margin-bottom: 32px;
        }

        button {
            background: #ff347d;
            color: white;
            border: none;
            padding: 15px 24px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 25px #ff347d55;
            transition: transform 0.2s;
        }

        button:hover {
            transform: scale(1.05);
        }

        .hidden {
            display: none;
        }

        .big-heart {
            font-size: 65px;
            margin-bottom: 20px;
            animation: beat 1s infinite;
        }

        .love-name {
            color: #72ffbd;
            font-size: clamp(27px, 8vw, 38px);
            margin: 18px 0;
            text-shadow: 0 0 20px #72ffbd55;
            overflow-wrap: anywhere;
        }

        .love-note {
            color: #ffb5d1;
            font-size: 17px;
            line-height: 1.8;
            margin: 20px 0;
        }

        .signature {
            color: #a99cff;
            font-size: 13px;
            margin-top: 25px;
        }

        .floating-heart {
            position: fixed;
            bottom: -40px;
            pointer-events: none;
            z-index: 1;
            animation: float-up linear forwards;
        }

        @keyframes beat {
            50% {
                transform: scale(1.17);
            }
        }

        @keyframes float-up {
            to {
                transform: translateY(-115vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <main class="card">

        <section id="welcome">
            <div class="eyebrow">✦ A SECRET MESSAGE ✦</div>

            <h1>Someone has a message for you...</h1>

            <p class="subtitle">
                I made something just for you. ♡
            </p>

            <button id="openButton">
                OPEN YOUR MESSAGE 💌
            </button>
        </section>

        <section id="surprise" class="hidden">
            <div class="big-heart">❤️‍🔥</div>

            <div class="eyebrow">JUST FOR YOU</div>

            <h1>I LOVE YOU</h1>

            <div class="love-name">3llooool 💚</div>

            <p class="love-note">
                You're my favorite person. ♡<br>
                Just a little reminder that<br>
                you're special to me. ❤️
            </p>

            <button id="heartButton">
                SEND MORE LOVE 💗
            </button>

            <p class="signature">Made with love ♡</p>
        </section>

    </main>

    <script>
        const welcome = document.getElementById("welcome");
        const surprise = document.getElementById("surprise");
        document.getElementById("openButton").addEventListener("click", () => {
            welcome.classList.add("hidden");
            surprise.classList.remove("hidden");

            for (let i = 0; i < 18; i++) {
                setTimeout(createHeart, i * 100);
            }
        });

        document.getElementById("heartButton").addEventListener("click", () => {
            for (let i = 0; i < 25; i++) {
                setTimeout(createHeart, i * 70);
            }
        });

        function createHeart() {
            const heart = document.createElement("span");

            heart.className = "floating-heart";
            heart.textContent = ["❤️", "💗", "💖", "💕", "💚"][
                Math.floor(Math.random() * 5)
            ];

            heart.style.left = Math.random() * 100 + "vw";
            heart.style.fontSize = (16 + Math.random() * 22) + "px";
            heart.style.animationDuration = (3 + Math.random() * 4) + "s";

            document.body.appendChild(heart);

            setTimeout(() => heart.remove(), 7500);
        }

        setInterval(createHeart, 650);
    </script>

</body>
</html>
